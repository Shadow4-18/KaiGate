; KaiGate firmware — Waveshare ESP32-S3-Touch-AMOLED-1.32
; MCU: ESP32-S3-PICO-1-N8R8 (8MB OPI PSRAM + 8MB Quad Flash)
;
; Requires Arduino-ESP32 >= 3.3.0 (Waveshare board support / USB CDC / I2S).
; pioarduino ships that core on IDF 5.x.

[platformio]
default_envs = kaigate
src_dir = src
include_dir = include
data_dir = data

[env:kaigate]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 921600

board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi

build_unflags =
  -std=gnu++11

build_flags =
  -std=gnu++17
  -O2
  -Wall
  -DCORE_DEBUG_LEVEL=3
  -DBOARD_HAS_PSRAM=1
  -DCONFIG_SPIRAM_MODE_OCT=1
  -DCONFIG_SPIRAM_USE_MALLOC=1
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_RUNNING_CORE=1
  -DARDUINO_EVENT_RUNNING_CORE=1
  -DLV_CONF_INCLUDE_SIMPLE
  -DLV_CONF_PATH="${PROJECT_DIR}/include/lv_conf.h"
  -DKAIGATE_FW_VERSION=\"1.0.0\"
  -I include
  -I src

lib_deps =
  lvgl/lvgl@8.3.11
  moononournation/GFX Library for Arduino@1.5.5
  h2zero/NimBLE-Arduino@2.2.3
  bblanchon/ArduinoJson@7.2.1
  adafruit/Adafruit MPU6050@2.2.6
  adafruit/Adafruit Unified Sensor@1.1.14
  adafruit/Adafruit DRV2605 Library@1.2.4
  bitbank2/AnimatedGIF@2.1.1

lib_ignore =
  SD
  SD_MMC
  HTTPClient

; Upload LittleFS image: pio run -t uploadfs
extra_scripts =
  pre:extra_script.py
